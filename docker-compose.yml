services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - FRONTEND_PORT=3000
      - BACKEND_API_BASE=http://localhost:5000
      - RAG_API_BASE=http://localhost:8000
    env_file:
      - .env
    depends_on:
      backend-node:
        condition: service_started
      ml-fastapi:
        condition: service_started
    networks:
      - legal-net

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: legal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/legal_rag
      - BACKEND_FASTAPI_URL=http://ml-fastapi:8000
      - CORS_ORIGIN=http://localhost:3000
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      ml-fastapi:
        condition: service_started
    networks:
      - legal-net

  ml-fastapi:
    build:
      context: ./ml-fastapi
      dockerfile: Dockerfile
    container_name: legal-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./ml-fastapi:/app
      - ./legal-dataset:/app/legal-dataset
      - chroma_data:/app/chroma_db
    networks:
      - legal-net

  mongo:
    image: mongo:7
    container_name: legal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legal-net

networks:
  legal-net:
    driver: bridge

volumes:
  mongo_data:
  chroma_data:
